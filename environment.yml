# ====================================================================
# SL_SPV — conda environment for the SL Sinhala/Tamil speaker
# verification project. Mirrors `requirements.txt` (BUGFIX-011) with
# CUDA-bundled PyTorch from the `pytorch` channel.
#
# Create:
#     conda env create -f environment.yml
# Activate:
#     conda activate SL_SPV
# Update after pulling new requirements:
#     conda env update -f environment.yml --prune
# Remove:
#     conda env remove -n SL_SPV
#
# Notes:
#   - Python 3.11 is the floor; PyTorch 2.1+ supports 3.8-3.12.
#   - pytorch-cuda=12.1 matches your installed driver (CUDA 12.5,
#     forward-compatible). Switch to 11.8 if you ever target older GPUs.
#   - Most deps go through conda (CUDA-aware, faster solver path).
#     Two pip-only packages (asteroid_filterbanks, transformers) live
#     under the `- pip:` section below.
#   - LaTeX (xelatex, IEEEtran) for PDF generation is NOT installed by
#     conda. Install separately at the system level:
#         sudo apt install texlive-xetex texlive-publishers texlive-fonts-extra
# ====================================================================

name: SL_SPV

channels:
  - pytorch
  - nvidia
  - conda-forge

dependencies:
  # ---- Python interpreter ----
  - python=3.11

  # ---- PyTorch ecosystem (CUDA 12.1 bundled) ----
  - pytorch>=2.1,<3
  - torchaudio>=2.1,<3
  - pytorch-cuda=12.1            # CUDA toolkit + cuDNN bundled by NVIDIA channel

  # ---- Numerical / ML utilities ----
  - numpy>=1.20,<3
  - scipy>=1.7,<2
  - scikit-learn>=1.0,<2

  # ---- Audio I/O ----
  # Conda package name is `pysoundfile`; the Python import is still `soundfile`.
  - pysoundfile>=0.10,<1
  - libsndfile                   # native dep of soundfile

  # ---- Config / CLI / I/O ----
  - pyyaml>=5.0,<7
  - tqdm>=4.0,<5

  # ---- Training observability (optional but recommended) ----
  - tensorboard>=2.0,<3
  - matplotlib>=3.0,<4

  # ---- Tooling ----
  - pip                          # for the pip-only dependencies below

  - pip:
      # asteroid_filterbanks: RawNet3 uses ParamSincFB with a
      # 0.4.0-specific keyword signature; pin exactly per BUGFIX-011.
      - asteroid_filterbanks==0.4.0

      # transformers: required ONLY for FEATURE-001 SSL frontends
      # (WavLM / XLS-R / mHuBERT). 4.30 is the floor that ships a
      # stable AutoModel API for the tested encoders.
      - "transformers>=4.30,<5"
