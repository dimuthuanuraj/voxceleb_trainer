# ⚠️ QUARANTINED CONFIG — TRAINS A NON-CONVERGENT MODEL ⚠️
# ----------------------------------------------------------------------
# Same quarantine status as the other nested_* configs — see
# configs/nested_4level.yaml's header banner and
# models/experimental/README.md / BUGFIX-010 for the full story. A
# 5-level nested net has even more gradient paths than the 4-level
# (2^5 = 32 paths) and is therefore strictly more unstable than the
# already-failing 4-level variant.
# ----------------------------------------------------------------------
#
# NESTED SPEAKER NETWORK - 5 Levels with ASP
# Original hypothesis: ~13.5% EER (vs 14.2% for 4-level) — not achieved.

## Model architecture
model: experimental.NestedSpeakerNet
num_levels: 5              # 5 levels (more depth)
nOut: 512
encoder_type: ASP
fusion_type: concat
n_mels: 80
log_input: true

## Data loader
augment: true
batch_size: 32
max_frames: 200
eval_frames: 0
nDataLoaderThread: 4
max_seg_per_spk: 500
seed: 42

## Training details
test_interval: 1
trainfunc: aamsoftmax
patience: 15
max_epoch: 100

## Optimizer
optimizer: adam
scheduler: steplr
lr: 0.001
lr_decay: 0.95
weight_decay: 0

## Loss functions
margin: 0.2
scale: 30
nPerSpeaker: 1
nClasses: 140

## Training and test data
train_list: ${SL_SPV_DATA_ROOT}/mini_voxceleb2_train_list.txt
test_list: ${SL_SPV_DATA_ROOT}/mini_test_list.txt
train_path: ${SL_SPV_DATA_ROOT}/mini_voxceleb2
test_path: ${SL_SPV_DATA_ROOT}/mini_voxceleb1

## Validation
max_test_pairs: 0
eval_batch_size: 1

## Augmentation
musan_path: ${SL_SPV_DATA_ROOT}/musan
rir_path: ${SL_SPV_DATA_ROOT}/RIRS_NOISES/simulated_rirs

## Performance optimization
mixedprec: true
prefetch_factor: 2
persistent_workers: true
gradient_accumulation_steps: 1

## Distributed
distributed: false
port: "8888"

## Save
save_path: exps/nested_5level_asp_exp1
initial_model: ""
