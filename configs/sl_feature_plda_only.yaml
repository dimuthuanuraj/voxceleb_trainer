# ====================================================================
# Feature-add: P0 + FEATURE-010 (two-covariance PLDA scoring) ONLY.
# --------------------------------------------------------------------
# Measures the STANDALONE contribution of PLDA scoring on the P0
# (from-scratch) embedding. Training unchanged; PLDA is an eval-time
# scoring backend that replaces cosine -cdist.
#
# Hypothesis: PLDA models the embedding distribution generatively
# (between-speaker + within-speaker covariance) and provides a
# likelihood-ratio score better suited to short utterances and
# noisy embeddings than plain cosine.
#
# Expected: 0-3% relative EER drop on long utterances (modern
# discriminative embeddings already do most of PLDA's job); 5-10%
# relative on short / channel-mismatched trials. PLDA is most useful
# when the embedding has high variance — which a from-scratch P0 model
# on 100 speakers definitely does, so this test may actually show a
# LARGER PLDA gain over P0 than over the regularised P2.
# ====================================================================

model: ECAPA_TDNN
nOut: 192
channels: 1024
n_mels: 80
sample_rate: 16000
log_input: true
encoder_type: ASP

augment: true
batch_size: 200
max_frames: 200
eval_frames: 0
nDataLoaderThread: 5
max_seg_per_spk: 500
seed: 42

test_interval: 1
trainfunc: aamsoftmax
patience: 15
max_epoch: 80

optimizer: adam
scheduler: steplr
lr: 0.001
lr_decay: 0.97
weight_decay: 2e-5

margin: 0.2
scale: 30
nPerSpeaker: 1
nClasses: 100

initial_model: ""

train_list: ${SL_SPV_DATA_ROOT}/sl_celeb/lists/train_list.txt
test_list:  ${SL_SPV_DATA_ROOT}/sl_celeb/lists/test_list.txt
train_path: ${SL_SPV_DATA_ROOT}/sl_celeb
test_path:  ${SL_SPV_DATA_ROOT}/sl_celeb
musan_path: ${SL_SPV_DATA_ROOT}/musan
rir_path:   ${SL_SPV_DATA_ROOT}/RIRS_NOISES/simulated_rirs

max_test_pairs: 0
eval_batch_size: 32

augment_chain:
  clean:  0.30
  reverb: 0.20
  music:  0.15
  speech: 0.15
  noise:  0.20

mixedprec: true
prefetch_factor: 2
persistent_workers: true
gradient_accumulation_steps: 1

distributed: false
port: "8888"

## ----- Single feature ON -----
plda: true
plda_train_list: ${SL_SPV_DATA_ROOT}/sl_celeb/lists/plda_train_list.txt
plda_train_path: ${SL_SPV_DATA_ROOT}/sl_celeb
plda_dim: 50                    # 2*plda_dim <= n_speakers = 100; max 50

## ----- All others OFF -----
finetune: false
llrd: false
lang_aux: false
as_norm: false

deterministic: true

save_path: exps/feature_plda_only_seed42
