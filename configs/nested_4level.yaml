# ⚠️ QUARANTINED CONFIG — TRAINS A NON-CONVERGENT MODEL ⚠️
# ----------------------------------------------------------------------
# This config targets models/experimental/NestedSpeakerNet.py, which has
# been moved to the experimental directory because three independent
# stabilisation attempts ended in NaN-cascade failures.
# See models/experimental/README.md and BUGFIX-010 for the full story.
# Kept here as a research artifact to reproduce the documented negative
# result, NOT as a recommended training config.
# ----------------------------------------------------------------------
#
# NESTED SPEAKER NETWORK - 4 Levels
# Based on "Nested Learning: The Illusion of Deep Learning Architecture"
# Original design hypothesis (NOT achieved in practice):
#   8-13% EER improvement + 2× faster than ResNetSE34L
# Empirical result: NaN at epoch 11 (BatchNorm) / 12 (GroupNorm).

## Model architecture
model: experimental.NestedSpeakerNet
num_levels: 4              # Number of nested levels (3, 4, or 5)
nOut: 512                  # Embedding dimension
encoder_type: SAP          # Temporal pooling: SAP or ASP
fusion_type: concat        # Multi-scale fusion: concat, attention, or sum
n_mels: 80
log_input: true

## Data loader - OPTIMIZED for nested architecture
augment: true
batch_size: 48             # Increased for more stable gradients
max_frames: 200
eval_frames: 0             # 0 = use full audio length
nDataLoaderThread: 4
max_seg_per_spk: 500
seed: 42

## Training details
test_interval: 1           # Validate every epoch (fast with nested)
trainfunc: aamsoftmax
patience: 20               # Increased patience for better convergence
max_epoch: 150             # More epochs for full convergence

## Optimizer
optimizer: adam
scheduler: steplr
lr: 0.0010                 # Back to moderate LR
lr_decay: 0.98             # Very gradual decay
weight_decay: 5e-5         # Lighter regularization

## Loss functions
margin: 0.2
scale: 30
nPerSpeaker: 1
nClasses: 140              # Mini VoxCeleb1: 140 speakers

## Training and test data - MINI DATASET
train_list: ${SL_SPV_DATA_ROOT}/mini_voxceleb2_train_list.txt
test_list: ${SL_SPV_DATA_ROOT}/mini_test_list.txt
train_path: ${SL_SPV_DATA_ROOT}/mini_voxceleb2
test_path: ${SL_SPV_DATA_ROOT}/mini_voxceleb1

## Validation settings
max_test_pairs: 0          # 0 = use all pairs (~12,559)
eval_batch_size: 1

## Augmentation paths
musan_path: ${SL_SPV_DATA_ROOT}/musan
rir_path: ${SL_SPV_DATA_ROOT}/RIRS_NOISES/simulated_rirs

## Performance optimization
mixedprec: true
prefetch_factor: 2
persistent_workers: true
gradient_accumulation_steps: 1

## Distributed training
distributed: false
port: "8888"

## Save path
save_path: exps/nested_4level_exp1
initial_model: ""
