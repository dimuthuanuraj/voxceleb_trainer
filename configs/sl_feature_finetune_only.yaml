# ====================================================================
# Feature-add: P0 + FEATURE-004 (cross-lingual fine-tune) ONLY.
# --------------------------------------------------------------------
# Measures the STANDALONE contribution of cross-lingual fine-tuning
# from English checkpoint, WITHOUT LLRD, WITHOUT any other lever.
#
# Hypothesis: even the bare cross-lingual init (no per-layer LR magic,
# no regularisation) provides most of the gain over training from
# scratch. Compare against P0 (no init) and P1 (init + LLRD).
#
# Expected: 25-45% relative EER drop vs P0. The P1 - feature_finetune_only
# delta tells you LLRD's marginal contribution.
# ====================================================================

model: ECAPA_TDNN
nOut: 192
channels: 1024
n_mels: 80
sample_rate: 16000
log_input: true
encoder_type: ASP

augment: true
batch_size: 200
max_frames: 200
eval_frames: 0
nDataLoaderThread: 5
max_seg_per_spk: 500
seed: 42

test_interval: 1
trainfunc: aamsoftmax
patience: 15
max_epoch: 60

optimizer: adam
scheduler: steplr
lr: 0.001
lr_decay: 0.97
weight_decay: 2e-5

margin: 0.2
scale: 30
nPerSpeaker: 1
nClasses: 100

initial_model: ${SL_SPV_DATA_ROOT}/checkpoints/ecapa_voxceleb1.model

train_list: ${SL_SPV_DATA_ROOT}/sl_celeb/lists/train_list.txt
test_list:  ${SL_SPV_DATA_ROOT}/sl_celeb/lists/test_list.txt
train_path: ${SL_SPV_DATA_ROOT}/sl_celeb
test_path:  ${SL_SPV_DATA_ROOT}/sl_celeb
musan_path: ${SL_SPV_DATA_ROOT}/musan
rir_path:   ${SL_SPV_DATA_ROOT}/RIRS_NOISES/simulated_rirs

max_test_pairs: 0
eval_batch_size: 32

augment_chain:
  clean:  0.30
  reverb: 0.20
  music:  0.15
  speech: 0.15
  noise:  0.20

mixedprec: true
prefetch_factor: 2
persistent_workers: true
gradient_accumulation_steps: 1

distributed: false
port: "8888"

## ----- Single feature ON -----
finetune: true
finetune_freeze: [frontend]
finetune_lr_multiplier: 0.1

## ----- All others OFF (this is the feature isolation point) -----
llrd: false                     # ← contrast against P1 to measure LLRD's marginal lift
lang_aux: false
as_norm: false
plda: false

deterministic: true

save_path: exps/feature_finetune_only_seed42
